<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="">
        <h1>Race Registration!</h1>

        <label for="first-name">First name</label>
        <input id="first-name" type="text" placeholder="Your First Name">
        <label for="last-name">Last Name</label>
        <input id="last-name" type="text" placeholder="Your last name">
        <br>
        <br>        
        <fieldset>
            <legend>Select a Race:</legend>
            <input type="radio" name="race" id="5k" value="5k">
        <label for="5k">Fun Run 5k</label>
        <br>
        <input type="radio" name="race" id="half-marathon" value="half-marathon">
        <label for="half-marathon">Half Marathon</label>
        <br>
        <input type="radio" name="race" id="full-marathon" value="full-marathon">
        <label for="full-marathon">Full Marathon</label>
        </fieldset>        
        <br>
        <label for="email">Email</label>        
        <input type="email" name="" id="email" placeholder="Insert your email address">
        <label for="password">Password</label>
        <input type="password" name="" id="password" placeholder="Insert your Password">
        <br>        
        <label for="age">Select Age Group</label>
        <select name="ages" id="age">
             <option value="under18">Under 18</option>
             <option value="under2536">Under 25-36</option>
             <option value="over55">Over 55</option>
        </select>
        <br>
        <button type="submit">Register!</button>          

        
    </form>
    <br>
    <a href="../index.html">Homepage</a>
  


</body>
</html>
