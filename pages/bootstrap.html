<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Buttons Exercise</title>
    <!--INCLUDING BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <section class="container mt-3 w-25">
        <h1 class="text-light bg-dark text-center">Bad News</h1>

        <div class="alert alert-warning">You are going to die one day! It sucks, but it's normal :( </div>

        <button class="btn btn-success">Come To Terms With</button>
        <button class="btn btn-danger">Continue To Deny</button>
    </section>


    <!-- grid -->
    <section class="mt-5">
        <div class="container text-center">
            <div class="row">
                <div class="col-6 col-sm-6 col-md-4 bg-success">Column</div>
                <div class="col-6 col-sm-6 col-md-4 bg-secondary">Column</div>
                <div class="col-6 col-sm-6 col-md-4 bg-success">Column</div>
            </div>
        </div>
    </section>

    <!-- grid2 -->
    <section class="mt-5">
        <div class="container text-center">
            <div class="row">
                <div class="col-4 bg-danger">One Third</div>
                <div class="col-8 bg-info">Two Thirds</div>
            </div>
            <div class="row">
                <div class="col-3 bg-warning">One Quarter</div>
                <div class="col-6 bg-primary">One Half</div>
                <div class="col-3 bg-warning">One Quarter</div>
            </div>
        </div>
    </section>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
